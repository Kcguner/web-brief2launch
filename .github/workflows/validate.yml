name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Repository self-check (includes script fixture regressions)
        run: node scripts/validate.mjs
      - name: Harness command files in sync
        run: node scripts/generate-commands.mjs --check